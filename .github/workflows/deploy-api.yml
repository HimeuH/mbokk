# .github/workflows/deploy-api.yml
#
# Deploys api/ only — web/ (Next.js) has its own deployment, not covered here.
#
# The app runs on a VPS shared with other applications, so what this pipeline
# can do on that machine is deliberately tiny:
#
#     ssh root@host "deploy sha-<commit>"
#
# The deploy key is pinned in authorized_keys to /opt/mbokk/deploy.sh and
# nothing else — no shell, no scp, no port forwarding. The server pulls the
# image, takes the compose file and its SOPS/age-encrypted configuration out of
# it, decrypts that with a key GitHub does not hold, migrates, restarts,
# health-checks and rolls back on failure. Previously this workflow received an
# unrestricted root session, which on a shared box meant it could break every
# neighbouring app.
#
# Required secrets (deploy mechanics only — app config lives in the encrypted
# api/deploy/prod.env, which this workflow never sees):
#   SERVER_HOST    — VPS IPv4
#   SERVER_SSH_KEY — private half of the key pinned to /opt/mbokk/deploy.sh

name: Deploy (api)

on:
  push:
    branches: [main]
    paths: ["api/**", ".github/workflows/deploy-api.yml"]
  workflow_dispatch:

concurrency:
  group: production-deploy-api
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Must be lowercase: GHCR rejects uppercase owners.
  IMAGE_NAME: himeuh/mbokk-api

jobs:
  ci:
    uses: ./.github/workflows/ci-api.yml

  build:
    runs-on: ubuntu-latest
    needs: ci

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          # The full SHA is what deploy.sh accepts, and what can be rolled back
          # to. `latest` is a moving target and is never deployed.
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        env:
          VPS_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$VPS_HOST" ] || [ -z "$DEPLOY_KEY" ]; then
            echo "::error::SERVER_HOST or SERVER_SSH_KEY is not configured."
            exit 1
          fi

          install -m 700 -d ~/.ssh
          # The trailing newline is required: OpenSSH refuses a private key
          # without one ("error in libcrypto").
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/deploy_key \
              -o BatchMode=yes \
              -o ConnectTimeout=20 \
              "root@${VPS_HOST}" \
              "deploy sha-${GITHUB_SHA}"

      # No smoke test against the public domain on purpose: deploy.sh already
      # probes the new container directly, which is what this deploy changed.
      # Curling the domain also tests DNS and TLS and, during a migration, can
      # report success while actually hitting the OLD server.

      - name: Report
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            {
              echo "### Deployed :rocket:"
              echo ""
              echo "\`sha-${GITHUB_SHA}\` is live"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Deploy failed :x:"
              echo ""
              echo "The stack was rolled back to the previous image automatically."
              echo ""
              echo "**Migrations were NOT reverted** — a rollback restores code, never schema."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
