# .github/workflows/deploy-api.yml
#
# Deploys api/ only — web/ (Next.js) has its own deployment, not covered
# here. Mirrors the proven pattern already running for instantcaisse on
# the same droplet (see infra/proxy/mbokk.conf for the shared-nginx side).

name: Deploy (api)

on:
  push:
    branches: [main]
    paths: ["api/**", "docker-compose.prod.yml", ".github/workflows/deploy-api.yml"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (default: short SHA)"
        required: false

concurrency:
  group: production-deploy-api
  cancel-in-progress: false

# Required secrets (set in GitHub repo → Settings → Secrets) — deploy
# mechanics ONLY. App config (APP_KEY, DOMAIN, FRONTEND_URL, DB_*) lives in
# a .env file created once by hand in APP_DIR on the server, same as
# instantcaisse — this workflow never writes or sees those values, only
# the IMAGE_TAG= line (for rollback), see docs/deploy-api.md.
#   SERVER_HOST    — production server IP (reused from instantcaisse)
#   SERVER_USER     — SSH user (reused from instantcaisse)
#   SERVER_SSH_KEY   — private SSH key, PEM format (reused from instantcaisse)
#   SERVER_PORT       — optional SSH port (default: 22)
#   APP_DIR            — Mbokk-specific deploy dir, e.g. /opt/mbokk (do NOT reuse instantcaisse's)
#
# Image registry is GitHub Container Registry (ghcr.io), not DigitalOcean's
# DOCR — DOCR's repo-count limit was already maxed out by other projects.
# Auth uses the auto-provided GITHUB_TOKEN (no secret to set up), and the
# ghcr.io/himeuh/mbokk-api package is public, so the server pulls it with
# no authentication at all — see docs/deploy-api.md for the one-time
# "make the package public" step (can't be done before the first push).

env:
  REGISTRY: ghcr.io/himeuh
  IMAGE_NAME: mbokk-api

jobs:
  ci:
    uses: ./.github/workflows/ci-api.yml

  build:
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Generate image tag
        id: meta
        run: |
          TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(git rev-parse --short HEAD)
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Image tag: ${TAG}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Encode compose file
        id: cfg
        run: |
          echo "compose=$(base64 -w0 docker-compose.prod.yml)" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          REGISTRY: ghcr.io/himeuh
          APP_DIR: ${{ secrets.APP_DIR }}
          COMPOSE_B64: ${{ steps.cfg.outputs.compose }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: IMAGE_TAG,REGISTRY,APP_DIR,COMPOSE_B64
          script: |
            set -e

            mkdir -p "${APP_DIR}"
            printf '%s' "${COMPOSE_B64}" | base64 -d > "${APP_DIR}/docker-compose.prod.yml"

            cd "${APP_DIR}"

            # .env (APP_KEY, DOMAIN, FRONTEND_URL, DB_*) is created once by
            # hand on this server — see docs/deploy-api.md — and never
            # touched here except for the IMAGE_TAG= line below.
            if [ ! -f .env ]; then
              echo ".env not found in ${APP_DIR} — create it by hand first (docs/deploy-api.md). Aborting."
              exit 1
            fi

            # Snapshot current image tag for rollback
            PREV_TAG=$(grep '^IMAGE_TAG=' .env 2>/dev/null | cut -d= -f2 || echo "latest")
            echo "Current tag: ${PREV_TAG} → New tag: ${IMAGE_TAG}"

            # No docker login needed — ghcr.io/himeuh/mbokk-api is public.

            # Pull new image (running container is untouched)
            echo "Pulling ${REGISTRY}/mbokk-api:${IMAGE_TAG}..."
            IMAGE_TAG="${IMAGE_TAG}" REGISTRY="${REGISTRY}" \
              docker compose -f docker-compose.prod.yml --env-file .env pull app

            # Ensure pgsql is running (idempotent)
            IMAGE_TAG="${IMAGE_TAG}" REGISTRY="${REGISTRY}" \
              docker compose -f docker-compose.prod.yml --env-file .env up -d --no-deps pgsql

            # ── STEP 1: Run migrations in a throwaway container ──────────
            # Old app is still live. If this fails we abort before touching it.
            echo "Running migrations against new image..."
            if ! IMAGE_TAG="${IMAGE_TAG}" REGISTRY="${REGISTRY}" \
                docker compose -f docker-compose.prod.yml --env-file .env run --rm \
                  --no-deps app php artisan migrate --force; then
              echo "Migration failed. Production app is still running on ${PREV_TAG}. Aborting."
              exit 1
            fi

            # Update .env with new IMAGE_TAG now that migrations passed
            # (in place if the line already exists — e.g. after a prior
            # deploy — otherwise append it; the hand-created .env won't
            # have one yet on the very first deploy).
            if grep -q '^IMAGE_TAG=' .env; then
              sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${IMAGE_TAG}|" .env
            else
              printf '\nIMAGE_TAG=%s\n' "${IMAGE_TAG}" >> .env
            fi

            # ── STEP 2: Swap app container to new image ───────────────────
            IMAGE_TAG="${IMAGE_TAG}" REGISTRY="${REGISTRY}" \
              docker compose -f docker-compose.prod.yml --env-file .env up -d --no-deps --remove-orphans app

            # ── STEP 3: Health check — roll back container if unhealthy ───
            echo "Waiting for app to become healthy..."
            attempts=0
            until docker compose -f docker-compose.prod.yml ps app | grep -q "(healthy)"; do
              attempts=$((attempts + 1))
              if [ "${attempts}" -ge 36 ]; then
                echo "New app unhealthy after 3 minutes. Rolling back container to ${PREV_TAG}..."
                docker compose -f docker-compose.prod.yml logs --tail=80 app || true
                if grep -q '^IMAGE_TAG=' .env; then
                  sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${PREV_TAG}|" .env
                else
                  printf '\nIMAGE_TAG=%s\n' "${PREV_TAG}" >> .env
                fi
                IMAGE_TAG="${PREV_TAG}" REGISTRY="${REGISTRY}" \
                  docker compose -f docker-compose.prod.yml --env-file .env up -d --no-deps app
                echo "Container rolled back to ${PREV_TAG}. Migrations already applied — check schema compatibility."
                exit 1
              fi
              sleep 5
            done

            # Prune old images
            docker image prune -f || true
            echo "Deploy complete: ${REGISTRY}/mbokk-api:${IMAGE_TAG}"

      - name: Smoke test
        run: |
          sleep 5
          HTTP_CODE=$(curl -o /dev/null -s -w "%{http_code}" \
            --max-time 15 \
            "https://api.mbokk.samafacture.com/api/search?q=ab" || echo "000")
          echo "HTTP response: ${HTTP_CODE}"
          if [[ ! "${HTTP_CODE}" =~ ^(200|422)$ ]]; then
            echo "Smoke test failed (HTTP ${HTTP_CODE})"
            exit 1
          fi
          echo "Smoke test passed."
