# .github/workflows/deploy-api.yml
#
# Deploys api/ only — web/ (Next.js) has its own deployment, not covered
# here. Mirrors the proven pattern already running for instantcaisse on
# the same droplet (see infra/proxy/mbokk.conf for the shared-nginx side).

name: Deploy (api)

on:
  push:
    branches: [main]
    paths: ["api/**", "docker-compose.prod.yml", ".github/workflows/deploy-api.yml"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (default: short SHA)"
        required: false

concurrency:
  group: production-deploy-api
  cancel-in-progress: false

# Required secrets (set in GitHub repo → Settings → Secrets):
#   DO_API_TOKEN             — DigitalOcean personal access token (reused from instantcaisse)
#   DO_REGISTRY               — e.g. registry.digitalocean.com/instantcaisse (reused registry)
#   SERVER_HOST                — production server IP (reused from instantcaisse)
#   SERVER_USER                — SSH user (reused from instantcaisse)
#   SERVER_SSH_KEY              — private SSH key, PEM format (reused from instantcaisse)
#   SERVER_PORT                 — optional SSH port (default: 22)
#   APP_DIR                      — Mbokk-specific deploy dir, e.g. /opt/mbokk (do NOT reuse instantcaisse's)
#   APP_KEY                       — Laravel app key for THIS app (php artisan key:generate --show)
#   DOMAIN                         — api.mbokk.fawzaynigroup.com
#   FRONTEND_URL                    — the web/ origin, drives CORS
#   SANCTUM_STATEFUL_DOMAINS         — usually same host as FRONTEND_URL, no scheme
#   DB_DATABASE / DB_USERNAME / DB_PASSWORD — Mbokk's own Postgres, isolated from instantcaisse's

env:
  REGISTRY: ${{ secrets.DO_REGISTRY }}
  IMAGE_NAME: mbokk-api

jobs:
  ci:
    uses: ./.github/workflows/ci-api.yml

  build:
    runs-on: ubuntu-latest
    needs: ci
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Generate image tag
        id: meta
        run: |
          TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(git rev-parse --short HEAD)
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Image tag: ${TAG}"

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_API_TOKEN }}

      - name: Authenticate Docker with DOCR
        run: doctl registry login --expiry-seconds 3600

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Encode compose file
        id: cfg
        run: |
          echo "compose=$(base64 -w0 docker-compose.prod.yml)" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          REGISTRY: ${{ secrets.DO_REGISTRY }}
          APP_DIR: ${{ secrets.APP_DIR }}
          DO_API_TOKEN: ${{ secrets.DO_API_TOKEN }}
          COMPOSE_B64: ${{ steps.cfg.outputs.compose }}
          APP_KEY: ${{ secrets.APP_KEY }}
          DOMAIN: ${{ secrets.DOMAIN }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          SANCTUM_STATEFUL_DOMAINS: ${{ secrets.SANCTUM_STATEFUL_DOMAINS }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: IMAGE_TAG,REGISTRY,APP_DIR,DO_API_TOKEN,COMPOSE_B64,APP_KEY,DOMAIN,FRONTEND_URL,SANCTUM_STATEFUL_DOMAINS,DB_DATABASE,DB_USERNAME,DB_PASSWORD
          script: |
            set -e

            mkdir -p "${APP_DIR}"
            printf '%s' "${COMPOSE_B64}" | base64 -d > "${APP_DIR}/docker-compose.prod.yml"

            cd "${APP_DIR}"

            # Snapshot current image tag for rollback BEFORE .env gets
            # overwritten below — this is the only place it's recorded.
            PREV_TAG=$(grep '^IMAGE_TAG=' .env 2>/dev/null | cut -d= -f2 || echo "latest")
            echo "Current tag: ${PREV_TAG} → New tag: ${IMAGE_TAG}"

            # Write/refresh .env with current secret values (idempotent — the
            # deploy is the single source of truth for these, not manual
            # edits). Carries PREV_TAG forward so a failed migration below
            # leaves .env pointing at what's actually still running.
            cat > .env <<ENVEOF
            APP_KEY=${APP_KEY}
            DOMAIN=${DOMAIN}
            FRONTEND_URL=${FRONTEND_URL}
            SANCTUM_STATEFUL_DOMAINS=${SANCTUM_STATEFUL_DOMAINS}
            DB_DATABASE=${DB_DATABASE}
            DB_USERNAME=${DB_USERNAME}
            DB_PASSWORD=${DB_PASSWORD}
            IMAGE_TAG=${PREV_TAG}
            ENVEOF

            # Authenticate with DOCR (no doctl needed on server)
            echo "${DO_API_TOKEN}" | \
              docker login registry.digitalocean.com \
                --username "${DO_API_TOKEN}" --password-stdin

            # Pull new image (running container is untouched)
            echo "Pulling ${REGISTRY}/mbokk-api:${IMAGE_TAG}..."
            IMAGE_TAG="${IMAGE_TAG}" REGISTRY="${REGISTRY}" \
              docker compose -f docker-compose.prod.yml --env-file .env pull app

            # Ensure pgsql is running (idempotent)
            IMAGE_TAG="${IMAGE_TAG}" REGISTRY="${REGISTRY}" \
              docker compose -f docker-compose.prod.yml --env-file .env up -d --no-deps pgsql

            # ── STEP 1: Run migrations in a throwaway container ──────────
            # Old app is still live. If this fails we abort before touching it.
            echo "Running migrations against new image..."
            if ! IMAGE_TAG="${IMAGE_TAG}" REGISTRY="${REGISTRY}" \
                docker compose -f docker-compose.prod.yml --env-file .env run --rm \
                  --no-deps app php artisan migrate --force; then
              echo "Migration failed. Production app is still running on ${PREV_TAG}. Aborting."
              exit 1
            fi

            # Update .env with new IMAGE_TAG now that migrations passed
            # (in place — the heredoc above already wrote one IMAGE_TAG=
            # line with PREV_TAG; appending a second would leave two lines
            # and corrupt the next deploy's PREV_TAG lookup).
            sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${IMAGE_TAG}|" .env

            # ── STEP 2: Swap app container to new image ───────────────────
            IMAGE_TAG="${IMAGE_TAG}" REGISTRY="${REGISTRY}" \
              docker compose -f docker-compose.prod.yml --env-file .env up -d --no-deps --remove-orphans app

            # ── STEP 3: Health check — roll back container if unhealthy ───
            echo "Waiting for app to become healthy..."
            attempts=0
            until docker compose -f docker-compose.prod.yml ps app | grep -q "(healthy)"; do
              attempts=$((attempts + 1))
              if [ "${attempts}" -ge 36 ]; then
                echo "New app unhealthy after 3 minutes. Rolling back container to ${PREV_TAG}..."
                docker compose -f docker-compose.prod.yml logs --tail=80 app || true
                sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${PREV_TAG}|" .env
                IMAGE_TAG="${PREV_TAG}" REGISTRY="${REGISTRY}" \
                  docker compose -f docker-compose.prod.yml --env-file .env up -d --no-deps app
                echo "Container rolled back to ${PREV_TAG}. Migrations already applied — check schema compatibility."
                exit 1
              fi
              sleep 5
            done

            # Prune old images
            docker image prune -f || true
            echo "Deploy complete: ${REGISTRY}/mbokk-api:${IMAGE_TAG}"

      - name: Smoke test
        run: |
          sleep 5
          HTTP_CODE=$(curl -o /dev/null -s -w "%{http_code}" \
            --max-time 15 \
            "https://api.mbokk.fawzaynigroup.com/api/search?q=ab" || echo "000")
          echo "HTTP response: ${HTTP_CODE}"
          if [[ ! "${HTTP_CODE}" =~ ^(200|422)$ ]]; then
            echo "Smoke test failed (HTTP ${HTTP_CODE})"
            exit 1
          fi
          echo "Smoke test passed."
