# ------------------------------------------------------------------
# api.mbokk.fawzaynigroup.com — Mbokk (Laravel API only)
# php-fpm upstream: mbokk-app:9000 (on shared proxy network)
#
# NOT tracked/deployed automatically — copy this file by hand to
# /opt/proxy/nginx/conf.d/mbokk.conf on the droplet, see
# docs/deploy-api.md for the full one-time setup checklist.
# ------------------------------------------------------------------

server {
    listen 80;
    server_name api.mbokk.fawzaynigroup.com;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.mbokk.fawzaynigroup.com;

    root /var/www/mbokk/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/api.mbokk.fawzaynigroup.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.mbokk.fawzaynigroup.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    location ~ /\. { deny all; }

    # Uploaded person photos (PersonController) — separate persistent
    # volume from the static public/ root above, see docker-compose.prod.yml
    # (mbokk_storage_public). Matches the URL shape Storage::disk('public')
    # already builds: APP_URL + /storage/<path>.
    location /storage/ {
        alias /var/www/mbokk/storage-public/;
    }

    location ~* \.(ico|css|js|gif|jpeg|jpg|png|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass mbokk-app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
    }

    location ~* \.(env|log|htaccess)$ { deny all; }

    # Person photo uploads (PersonController) — matches php.ini's
    # upload_max_filesize/post_max_size.
    client_max_body_size 16M;
}
