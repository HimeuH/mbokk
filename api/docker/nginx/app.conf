# Mbokk API — this app's OWN web server.
#
# Plain HTTP on :80, nothing published to the host. TLS, HSTS and certificates
# belong to the shared edge proxy, which forwards here.
#
# This replaces the hand-copied site file that used to live on the shared proxy
# (infra/proxy/mbokk.conf). That arrangement meant shared infrastructure had to
# know this app's volumes, file layout and FastCGI port, and a mistake in it
# took down every other app on the box. Now it ships with the app.
server {
    listen 80;
    server_name _;

    root /var/www/public;
    index index.php;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location ~ /\. { deny all; }

    # Uploaded person photos (PersonController) live on their own persistent
    # volume, separate from the static public/ root above. Matches the URL
    # Storage::disk('public') builds: APP_URL + /storage/<path>.
    location /storage/ {
        alias /var/www/storage-public/;
    }

    location ~* \.(ico|css|js|gif|jpeg|jpg|png|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Resolve the upstream at REQUEST time, not at startup. A plain
        # `fastcgi_pass app:9000` is resolved once when nginx boots, so if the
        # app container is briefly absent during a redeploy, nginx refuses to
        # start at all. With a variable, nginx always starts and a request just
        # gets a 502 until the app is back.
        resolver 127.0.0.11 valid=10s;
        set $upstream app:9000;
        fastcgi_pass $upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        # The edge proxy terminates TLS; tell PHP, or Laravel builds http://
        # URLs and redirect-loops behind it.
        fastcgi_param HTTPS on;
        fastcgi_param REQUEST_SCHEME https;
        include fastcgi_params;
        fastcgi_read_timeout 60;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
    }

    location ~* \.(env|log|htaccess)$ { deny all; }

    # Matches php.ini's upload_max_filesize/post_max_size.
    client_max_body_size 16M;
}
