; ============================================================
; File uploads — person photos (PersonController)
; ============================================================
upload_max_filesize=16M
post_max_size=16M
memory_limit=256M
max_execution_time=60

; ============================================================
; Error handling — errors go to stderr, never to output
; ============================================================
display_errors=Off
display_startup_errors=Off
log_errors=On
error_log=/proc/self/fd/2

; ============================================================
; Security
; ============================================================
expose_php=Off

; ============================================================
; Timezone
; ============================================================
date.timezone=UTC
